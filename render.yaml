services:
  - type: web
    name: word-finder-app
    env: python
    buildCommand: |
      echo "Installing Python dependencies..."
      pip install -r requirements.txt
      echo "Installing Node.js dependencies..."
      npm install
      echo "Building Tailwind CSS..."
      npm run build:css
      echo "Verifying build..."
      python verify_build.py
      echo "Setting permissions..."
      chmod -R 755 app/static/css/
      echo "Build completed successfully!"
    startCommand: export PYTHONPATH=$PYTHONPATH:$(pwd) && gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: NODE_VERSION
        value: 20.11.1
      - key: FLASK_ENV
        value: production
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: FLASK_APP
        value: wsgi.py
      - key: NODE_ENV
        value: production
      - key: TAILWIND_MODE
        value: build
      - key: FLASK_DEBUG
        value: 0
      - key: SECRET_KEY
        value: 69d689b96758b69d2568c180d9b59b603da42a77be46d49165f51ed587d7bbc7
    healthCheckPath: /health
    autoDeploy: true 